name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build bundle
        run: |
          npm ci
          npm run build
          cp dist/ua-outages-card.js ua-outages-card.js

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ua-outages-card.js
          generate_release_notes: true

